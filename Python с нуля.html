<head>

<title>Python с нуля</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f8fa;--tx:#16181d;--mu:#5d6573;--bd:#dfe2e8;--ac:#3b78c4;--y:#ffd43b;--ok:#2a9d5c;--er:#d8453d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101319;--tx:#e8eaee;--mu:#98a0ad;--bd:#2a2f39}}
:root[data-theme=dark]{--bg:#101319;--tx:#e8eaee;--mu:#98a0ad;--bd:#2a2f39}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 Onest,system-ui,sans-serif}
[hidden]{display:none!important}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--bd)}
.lg{font-weight:800;font-size:18px;white-space:nowrap}
.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--y);margin-right:10px;box-shadow:0 0 0 3px var(--ac)}
.pg{flex:1;max-width:360px;height:6px;border-radius:9px;background:var(--bd);overflow:hidden}
#bar{display:block;height:100%;width:0;background:var(--ac);transition:width .4s}
#pc{color:var(--mu);font-size:14px;white-space:nowrap}
#mb{display:none}
.w{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1560px;margin:0 auto}
nav{position:sticky;top:58px;align-self:start;max-height:calc(100vh - 58px);overflow:auto;padding:14px 12px 24px 20px}
nav h4{margin:18px 0 6px 10px;font-size:13px;color:var(--mu);font-weight:600}
nav a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;color:inherit;text-decoration:none;font-size:15px}
nav a:hover,nav a.on{background:var(--bd)}
nav a.on{font-weight:600}
nav b{display:grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--bd);font-size:11px}
nav a.on b{border-color:var(--ac);color:var(--ac)}
nav a.dn b{background:var(--ok);border-color:var(--ok);color:#fff}
main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:36px;padding:28px 28px 48px 16px;align-items:start}
h1{margin:0 0 10px;font-size:30px;line-height:1.2;font-weight:800}
#th p{max-width:62ch;margin:0 0 12px}
code{font:.88em 'JetBrains Mono',ui-monospace,Consolas,monospace;background:var(--bd);padding:2px 6px;border-radius:5px}
pre{font:13.5px/1.6 'JetBrains Mono',ui-monospace,Consolas,monospace;background:#0e1116;color:#e6e9ef;padding:14px 16px;border-radius:8px;overflow-x:auto;margin:12px 0}
.tk{margin-top:20px;padding:14px 18px;background:color-mix(in srgb,var(--y) 14%,var(--bg));border-left:4px solid var(--y);border-radius:0 8px 8px 0}
.tk b{display:block}
#sp{margin-bottom:8px}
#sp a{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:6px;border-radius:50%;border:1.5px solid var(--mu);color:inherit;text-decoration:none;font-size:13px}
#sp a.on{border-color:var(--ac);color:var(--ac);font-weight:600}
#sp a.dn{background:var(--ok);border-color:var(--ok);color:#fff}
#sp a.lk{opacity:.4;pointer-events:none}
.ide{background:#0e1116;color:#e6e9ef;border-radius:12px;overflow:hidden;box-shadow:0 14px 40px -20px #000}
.bar2{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#181c24;border-bottom:1px solid #262b35}
.bar2 span{margin-right:auto;color:#8e97a6;font-size:13px}
button{font:600 14px Onest,system-ui,sans-serif;padding:7px 14px;border-radius:6px;border:1px solid #333a46;background:transparent;color:#e6e9ef;cursor:pointer}
button:hover{background:#262b35}
button:disabled{opacity:.45;cursor:default}
button.p{background:var(--ac);border-color:var(--ac)}
button.g{background:var(--ok);border-color:var(--ok)}
.ed{position:relative;background:#0e1116}
#hl,textarea{margin:0;padding:14px 16px;border:0;border-radius:0;font:14px/1.65 'JetBrains Mono',ui-monospace,Consolas,monospace;tab-size:4;white-space:pre-wrap;overflow-wrap:anywhere}
#hl{min-height:250px;background:none;color:#e6e9ef;overflow:visible;pointer-events:none}
textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;overflow:hidden;outline:0;background:transparent;color:transparent;caret-color:#fff}
textarea::selection{background:#3b78c4aa}
.ed textarea:focus-visible{outline-offset:-3px}
pre i{font-style:normal}
pre .k{color:#c792ea}pre .s{color:#c3e88d}pre .n{color:#f78c6c}pre .c{color:#6f7f93;font-style:italic}pre .b{color:#ffcb6b}pre .f{color:#82aaff}
#ht{padding:12px 16px;background:#1b1f27;color:#c3c9d4;font-size:14.5px;border-bottom:1px solid #262b35}
#ht code{background:#2a303b}
#out{margin:0;border-radius:0;background:#0a0c10;min-height:120px;max-height:300px;overflow:auto;white-space:pre-wrap;font-size:13.5px}
#out:empty::before{content:'Здесь появится результат программы';color:#6b7482}
.er{color:#ff8b83}
.in{background:transparent;border:0;border-bottom:1px solid #58a6ff;color:#79c0ff;font:inherit;outline:0;width:50%}
#fbw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid #262b35;font-weight:600}
#fb.ok{color:#4cc380}#fb.bad{color:#ffb454}
button:focus-visible,textarea:focus-visible,nav a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(max-width:1000px){main{grid-template-columns:1fr;padding:20px 16px 40px}}
@media(max-width:860px){.w{display:block}#mb{display:block;padding:5px 11px;color:var(--tx);border-color:var(--bd)}nav{display:none;position:fixed;inset:58px 0 64px;z-index:4;background:var(--bg);max-height:none}.m nav{display:block}}
#tabs{display:flex;gap:4px;margin-left:auto}
#tabs a{padding:6px 12px;border-radius:8px;color:inherit;text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap}
#tabs a.on,#tabs a:hover{background:var(--bd)}
#hr{font-size:17px;white-space:nowrap;letter-spacing:1px}
.br{display:inline-block;animation:sh .5s}
@keyframes sh{20%{transform:translateX(-3px) rotate(-12deg)}60%{transform:translateX(3px) rotate(12deg)}}
@media(prefers-reduced-motion:reduce){.br{animation:none}}
.pgw{max-width:860px;margin:0 auto;padding:32px 20px 60px}
.pgw p{max-width:60ch}
.mu{color:var(--mu);font-size:14px}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:16px}
.ac{display:flex;gap:12px;padding:14px 16px;border:1px solid var(--bd);border-radius:10px}
.ac.lk{opacity:.45;filter:grayscale(1)}
.ic{font-size:28px;line-height:1}
.ac small{color:var(--mu)}
.pr{display:flex;align-items:baseline;gap:10px;margin:18px 0}
.pr b{font-size:44px;line-height:1}
.pgw ul{padding-left:20px;margin:0 0 20px}
.cd{display:flex;gap:8px;margin-top:18px;max-width:380px}
.cd input{flex:1;min-width:0;padding:8px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
#ps button.p{padding:10px 20px;font-size:15px}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:9;max-width:90vw;padding:10px 16px;border-radius:10px;background:#181c24;color:#fff;font-weight:600;box-shadow:0 10px 30px -10px #000}
@media(max-width:860px){#tabs{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:var(--bg);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}#tabs a{font-size:13px;padding:6px 8px}body{padding-bottom:64px}#pc{display:none}.pg{max-width:none}}
</style>

<main>

<script>
const $=id=>document.getElementById(id);
const L=[
{g:'Основы',t:'Привет, мир!',th:`<p>Программа — это набор команд, которые компьютер выполняет сверху вниз. Команда <code>print()</code> выводит текст на экран. Текст берут в кавычки.</p><pre>print("Привет!")</pre><p>Нажми «Запустить» (или Ctrl+Enter), чтобы увидеть результат.</p>`,k:`Выведи на экран текст <code>Привет, мир!</code>`,s:'',h:`Напиши <code>print("Привет, мир!")</code> — слово print маленькими буквами, текст в кавычках.`,c:o=>o=='Привет, мир!'},
{t:'Переменные',th:`<p>Переменная — имя, под которым хранится значение. Знак <code>=</code> кладёт значение в переменную, а <code>print()</code> показывает его.</p><pre>city = "Казань"\nprint(city)</pre><p>Имена пишут латиницей и без пробелов: <code>age</code>, <code>user_name</code>.</p>`,k:`Создай переменную <code>age</code> со значением <code>25</code> и выведи её.`,s:'',h:`<code>age = 25</code>, а следующей строкой <code>print(age)</code>.`,c:(o,k)=>o=='25'&&/age\s*=\s*25/.test(k)},
{t:'Числа и математика',th:`<p>Python считает как калькулятор: <code>+</code> <code>-</code> <code>*</code> <code>/</code>. Ещё три знака: <code>//</code> — целое деление, <code>%</code> — остаток, <code>**</code> — степень.</p><pre>print(7 // 2)  # 3\nprint(7 % 2)   # 1\nprint(2 ** 3)  # 8</pre>`,k:`Выведи, чему равно 2 в степени 10.`,s:'',h:`<code>print(2 ** 10)</code>`,c:(o,k)=>o=='1024'&&(k.includes('**')||k.includes('pow'))},
{t:'Строки',th:`<p>Строка — текст в кавычках. У строк есть методы: <code>.upper()</code> делает буквы заглавными, <code>.lower()</code> — строчными, а <code>len()</code> считает символы.</p><pre>s = "hi"\nprint(s.upper())  # HI\nprint(len(s))     # 2</pre>`,k:`Выведи переменную <code>word</code> заглавными буквами, а на следующей строке — её длину.`,s:'word = "python"\n',h:`<code>print(word.upper())</code> и <code>print(len(word))</code>`,c:(o,k)=>o=='PYTHON\n6'&&k.includes('.upper()')&&k.includes('len(')},
{t:'f-строки',th:`<p>Чтобы вставить переменную в текст, поставь <code>f</code> перед кавычками, а переменную возьми в фигурные скобки.</p><pre>name = "Аня"\nprint(f"Привет, {name}!")</pre>`,k:`Выведи <code>Мне 30 лет</code>, подставив переменную <code>age</code> через f-строку.`,s:'age = 30\n',h:`<code>print(f"Мне {age} лет")</code>`,c:(o,k)=>o=='Мне 30 лет'&&/f["']/.test(k)&&k.includes('{')},
{t:'Ввод данных',th:`<p><code>input()</code> спрашивает данные у пользователя и возвращает строку. Для числа оберни результат в <code>int()</code>.</p><pre>name = input("Имя: ")\nage = int(input("Возраст: "))</pre><p>Когда программа ждёт ввод, печатай прямо в консоли и жми Enter.</p>`,k:`Спроси имя через <code>input()</code> и выведи <code>Привет, имя!</code>. Нажми «Проверить» и введи имя в консоли.`,s:'',h:`<code>name = input("Как тебя зовут? ")</code><br><code>print(f"Привет, {name}!")</code>`,c:(o,k)=>k.includes('input(')&&/Привет, .+!/.test(o)},
{g:'Условия и циклы',t:'Условия if',th:`<p>Условие выбирает, какой код выполнить. После <code>if</code> и <code>else</code> ставят двоеточие, а код внутри сдвигают на 4 пробела (редактор делает это сам после Enter).</p><pre>if x &gt; 0:\n    print("плюс")\nelse:\n    print("не плюс")</pre><p>Сравнения: <code>==</code> <code>!=</code> <code>&lt;</code> <code>&gt;</code> <code>&lt;=</code> <code>&gt;=</code></p>`,k:`Выведи <code>чётное</code>, если число <code>n</code> чётное, иначе — <code>нечётное</code>.`,s:'n = 7\n',h:`Число чётное, если остаток от деления на 2 равен нулю: <code>n % 2 == 0</code>.`,c:(o,k)=>o=='нечётное'&&k.includes('if')&&k.includes('%')},
{t:'Цикл for',th:`<p>Цикл повторяет код. <code>range(3)</code> даёт числа 0, 1, 2, а <code>range(1, 4)</code> — 1, 2, 3 (последнее число не входит).</p><pre>for i in range(3):\n    print(i)</pre>`,k:`Выведи числа от 1 до 5, каждое с новой строки.`,s:'',h:`<code>for i in range(1, 6):</code>, а внутри цикла (с отступом) <code>print(i)</code>.`,c:(o,k)=>o=='1\n2\n3\n4\n5'&&k.includes('for')},
{t:'Цикл while',th:`<p><code>while</code> повторяет код, пока условие истинно. Не забывай менять переменную внутри цикла, иначе он не закончится.</p><pre>n = 3\nwhile n &gt; 0:\n    print(n)\n    n = n - 1</pre>`,k:`Удваивай <code>n</code>, пока оно меньше 100. После цикла выведи <code>n</code>.`,s:'n = 1\n',h:`<code>while n &lt; 100:</code>, внутри <code>n = n * 2</code>, а <code>print(n)</code> — после цикла, без отступа.`,c:(o,k)=>o=='128'&&k.includes('while')},
{g:'Коллекции',t:'Списки',th:`<p>Список хранит несколько значений в квадратных скобках. Нумерация идёт с нуля. <code>.append(x)</code> добавляет элемент в конец, <code>len()</code> считает элементы, <code>sum()</code> складывает числа.</p><pre>a = [10, 20]\na.append(30)\nprint(a[0])    # 10\nprint(len(a))  # 3</pre>`,k:`Добавь в список <code>nums</code> числа 16 и 23 через <code>append</code> и выведи сумму всех чисел.`,s:'nums = [4, 8, 15]\n',h:`<code>nums.append(16)</code>, <code>nums.append(23)</code>, затем <code>print(sum(nums))</code>`,c:(o,k)=>o=='66'&&k.includes('append')},
{t:'Словари',th:`<p>Словарь хранит пары «ключ: значение» в фигурных скобках. Читать и менять значения можно через квадратные скобки с ключом.</p><pre>user = {"name": "Аня"}\nuser["age"] = 20\nprint(user["name"])</pre>`,k:`Измени <code>age</code> на 21 и добавь ключ <code>city</code> со значением <code>Москва</code>. Выведи <code>age</code> и <code>city</code> — каждое с новой строки.`,s:'user = {"name": "Аня", "age": 20}\n',h:`<code>user["age"] = 21</code> и <code>user["city"] = "Москва"</code>, потом два <code>print(user[...])</code>.`,c:(o,k)=>o=='21\nМосква'&&k.includes('user[')},
{g:'Функции и финал',t:'Функции',th:`<p>Функция — именованный кусок кода, который можно вызывать много раз. <code>def</code> объявляет её, <code>return</code> возвращает результат.</p><pre>def double(x):\n    return x * 2\n\nprint(double(4))  # 8</pre>`,k:`Напиши функцию <code>square(x)</code>, которая возвращает квадрат числа, и выведи <code>square(9)</code>.`,s:'',h:`<code>def square(x):</code>, внутри <code>return x * x</code>, потом <code>print(square(9))</code>.`,c:(o,k)=>o=='81'&&k.includes('def square')&&k.includes('return')},
{t:'Финал: FizzBuzz',th:`<p>Классическая задача объединяет всё, что ты выучил: цикл, условия и остаток от деления. Порядок проверок здесь важен.</p>`,k:`Для чисел от 1 до 15 выведи <code>Fizz</code>, если число делится на 3; <code>Buzz</code> — если на 5; <code>FizzBuzz</code> — если на оба; иначе само число.`,s:'',h:`Сначала проверь деление и на 3, и на 5 (<code>i % 15 == 0</code>), потом отдельно на 3, потом на 5, а иначе <code>print(i)</code>.`,c:(o,k)=>o=='1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz'&&k.includes('for')&&k.includes('%')}
];
const X=[
[{k:`Выведи в одной строке <code>Мне 7 лет</code>, передав в <code>print</code> три значения через запятую: <code>"Мне", 7, "лет"</code>`,h:`<code>print("Мне", 7, "лет")</code> — пробелы между значениями Python ставит сам.`,c:(o,k)=>o=='Мне 7 лет'&&/print\(.+,.+,/.test(k)},
{f:1,k:`Выведи три любые строки о себе (имя, город, хобби) — каждую отдельным <code>print</code>.`,c:(o,k)=>(k.match(/print\(/g)||[]).length>=3&&o.split('\n').length>=3&&!/мир/.test(o)}],
[{k:`Код выдаёт ошибку. Найди её и исправь, чтобы вывелось <code>Аня</code>.`,s:'name = "Аня"\nprint(Name)\n',h:`Python различает большие и маленькие буквы: <code>name</code> и <code>Name</code> — разные имена.`,c:(o,k)=>o=='Аня'},
{f:1,k:`Создай переменные <code>price</code> (цена) и <code>count</code> (количество) — любые числа — и выведи их произведение.`,c:(o,k)=>{const p=k.match(/price\s*=\s*([\d.]+)/),c=k.match(/count\s*=\s*([\d.]+)/);return!!p&&!!c&&+o==p[1]*c[1]}}],
[{k:`47 конфет делят поровну между 5 детьми. Выведи, сколько получит каждый, а на следующей строке — сколько останется.`,h:`Целое деление — <code>//</code>, остаток — <code>%</code>.`,c:(o,k)=>o=='9\n2'&&k.includes('//')&&k.includes('%')},
{f:1,k:`Возведи 9 в квадрат и выведи остаток от деления этого числа на 7.`,c:(o,k)=>o=='4'&&k.includes('**')&&k.includes('%')}],
